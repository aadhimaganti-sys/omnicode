[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "omnicode"
version = "0.1.0"
description = "OmniCode - an extensible multi-LLM AI coding assistant with a rich CLI and a lightweight web IDE."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OmniCode contributors" }]
keywords = ["ai", "llm", "coding-assistant", "gemini", "claude", "openai", "ollama", "cli", "ide"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development",
]
dependencies = [
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    # Core
    "pydantic>=2.6",
    "httpx>=0.27",
    # Provider SDKs
    "google-genai>=2.25.0",
    "anthropic>=0.40",
    "openai>=1.50",
    # Web IDE
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
omnicode = "omnicode.cli.app:run"
coder = "omnicode.cli.app:run_coder"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
